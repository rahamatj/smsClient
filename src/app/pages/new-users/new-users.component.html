<form method="post">
    <div>
        <app-label>Username</app-label>
        <app-input-field
                id="username"
                type="text"
                placeholder="Enter your username"
                [validators]="'required | minLength:3 | maxLength:20 | unique'"
                [value]="username"
                (valueChange)="handleUsernameChange($event)"
                (errorChange)="handleUsernameErrorChange($event)"
        />
    </div>
    <div>
        <app-label>Password</app-label>
        <app-input-field
                id="password"
                type="password"
                placeholder="Enter your password"
                [validators]="'required | minLength:3 | maxLength:20'"
                [value]="password"
                (valueChange)="handlePasswordChange($event)"
                (errorChange)="handlePasswordErrorChange($event)"
        />
    </div>
    <div>
        <app-label>Confirm Password</app-label>
        <app-input-field
                id="confirm-password"
                type="password"
                placeholder="Enter your password again"
                [validators]="'required | minLength:3 | maxLength:20'"
                [value]="confirmPassword"
                (valueChange)="handleConfirmPasswordChange($event)"
                (errorChange)="handleConfirmPasswordErrorChange($event)"
        />
        @if (hasPasswordMismatch) {
            <p class="mt-1.5 text-xs text-error-500">Passwords do not match.</p>
        }
    </div>
    <div>
        <app-label>Role</app-label>
        <app-select
                [options]="options"
                placeholder="Select user role"
                [value]="role"
                className="dark:bg-dark-900"
        ></app-select>
    </div>
    <div class="flex items-center gap-5 mt-4">
        <app-button (click)="onSubmit()" size="sm" variant="primary" [disabled]="isSubmitDisabled">
            Create User
        </app-button>
    </div>
</form>
